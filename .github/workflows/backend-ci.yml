name: Backend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sheltra_db_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_USER: sheltra
          MYSQL_PASSWORD: secret
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'
        extensions: dom, curl, libxml, mbstring, zip, pdo, mysql, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
        coverage: xdebug

    - name: Install Composer dependencies
      working-directory: server
      run: composer install --prefer-dist --no-progress --no-suggest
      
    - name: Copy environment file
      working-directory: server
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Database setup
      working-directory: server
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: sheltra_db_test
        DB_USERNAME: root
        DB_PASSWORD: secret
      run: |
        php artisan migrate --force
        php artisan db:seed --force

    - name: Run PHPUnit tests
      working-directory: server
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: sheltra_db_test
        DB_USERNAME: root
        DB_PASSWORD: secret
      run: php artisan test --no-interaction

    - name: Check PHP code style
      working-directory: server
      run: |
        composer require --dev squizlabs/php_codesniffer
        ./vendor/bin/phpcs app --standard=PSR12 2>/dev/null || true
      continue-on-error: true

    - name: Generate test coverage
      working-directory: server
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: sheltra_db_test
        DB_USERNAME: root
        DB_PASSWORD: secret
      run: |
        php artisan test --coverage --coverage-html=coverage-report 2>/dev/null || true
      continue-on-error: true

    - name: Upload coverage report
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage
        path: server/coverage-report/
        retention-days: 5
      if: always()
