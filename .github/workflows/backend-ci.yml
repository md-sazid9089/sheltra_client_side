name: CI - Backend Only

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'database/migrations/**'
      - 'database/seeders/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'server/**'
      - 'database/migrations/**'
      - 'database/seeders/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Tests & Analysis
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sheltra_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysql, pdo_mysql, pdo_sqlite, curl, json, mbstring, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: server
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --ignore-platform-reqs

      - name: Copy .env for testing
        working-directory: server
        run: |
          cp .env.example .env.testing
          # Ensure required keys are present
          grep -q "APP_KEY=" .env.testing || echo "APP_KEY=" >> .env.testing

      - name: Generate Laravel app key
        working-directory: server
        run: |
          php artisan key:generate --env=testing --force
        env:
          APP_ENV: testing
          APP_DEBUG: true

      - name: Run database migrations
        working-directory: server
        run: |
          echo "Running migrations..."
          php artisan migrate \
            --database=sqlite \
            --env=testing \
            --force \
            --verbose
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing

      - name: Seed database (optional)
        working-directory: server
        continue-on-error: true
        run: |
          if [ -f "database/seeders/DatabaseSeeder.php" ]; then
            php artisan db:seed --env=testing --force --verbose
          fi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing

      - name: Run PHPUnit tests
        working-directory: server
        run: |
          if [ -f "phpunit.xml" ]; then
            vendor/bin/phpunit --testdox --colors=never --verbose
          else
            echo "phpunit.xml not found, skipping tests"
          fi
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_ENV: testing
          APP_DEBUG: true

      - name: Check Laravel config is valid
        working-directory: server
        run: php artisan config:cache --verbose
        continue-on-error: true
        env:
          APP_ENV: testing

      - name: List all routes (sanity check)
        working-directory: server
        run: |
          php artisan route:list | head -20
          echo "..."
          echo "✅ Routes loaded successfully"
        continue-on-error: true
        env:
          APP_ENV: testing

      - name: Run Pint formatter check
        working-directory: server
        run: |
          if [ -f "vendor/bin/pint" ]; then
            echo "Running Pint..."
            vendor/bin/pint --test --verbose
          else
            echo "Pint not installed"
            composer require --dev laravel/pint 2>/dev/null || echo "Could not install Pint"
          fi
        continue-on-error: true

      - name: Run PHPStan static analysis
        working-directory: server
        run: |
          if [ -f "vendor/bin/phpstan" ]; then
            echo "Running PHPStan..."
            vendor/bin/phpstan analyse app --level=4 --error-format=github
          else
            echo "PHPStan not installed"
            composer require --dev phpstan/phpstan 2>/dev/null || echo "Could not install PHPStan"
          fi
        continue-on-error: true

      - name: Check migrations status
        working-directory: server
        run: |
          php artisan migrate:status --env=testing 2>/dev/null || echo "Migration status check skipped"
        continue-on-error: true
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Final status
        run: echo "✅ Backend CI completed successfully!"
