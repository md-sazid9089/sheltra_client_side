name: CI - Frontend & Backend

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # ========================================
  # FRONTEND CI JOB
  # ========================================
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]  # LTS version

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint code (if have .prettierrc/.eslintrc)
        working-directory: client
        run: |
          if [ -f .prettierrc ] || [ -f .eslintrc.json ]; then
            echo "Running linter..."
            npm run lint 2>/dev/null || echo "No lint script found, skipping"
          else
            npx prettier --check . || echo "Prettier check skipped (not configured)"
          fi
        continue-on-error: true

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com
          VITE_BACKEND_ENDPOINT: https://api.example.com
          VITE_APP_ENV: production

      - name: Verify build output
        working-directory: client
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: dist/index.html not found"
            exit 1
          fi
          echo "✅ Build successful: $(ls -lh dist/index.html)"
          echo "Build artifacts:"
          find dist -type f -name "*.js" -o -name "*.css" | head -10

  # ========================================
  # BACKEND CI JOB
  # ========================================
  backend-ci:
    name: Backend Tests & Analysis
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sheltra_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysql, pdo_mysql, pdo_sqlite, curl, json
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: server
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: server
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env.testing file
        working-directory: server
        run: |
          cp .env.example .env.testing
          sed -i 's/APP_ENV=.*/APP_ENV=testing/' .env.testing
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=true/' .env.testing
          sed -i 's/APP_KEY=.*/APP_KEY=base64:abcdefghijklmnopqrstuvwxyz1234=/' .env.testing
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env.testing
          mkdir -p database
          touch database/database.sqlite
          echo "✅ .env.testing created"

      - name: Generate Laravel app key for CI
        working-directory: server
        run: php artisan key:generate --env=testing --force 2>/dev/null || true
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run database migrations (SQLite test DB)
        working-directory: server
        run: |
          php artisan migrate \
            --env=testing \
            --force 2>&1 || echo "⚠ Migrations status: $?"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Seed database for tests
        working-directory: server
        continue-on-error: true
        run: |
          php artisan db:seed --env=testing --force 2>&1 || echo "⚠ Seeding skipped"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run PHPUnit tests
        working-directory: server
        continue-on-error: true
        run: |
          vendor/bin/phpunit --testdox --colors=never 2>&1 || echo "⚠ Tests status: $?"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Run Pint formatting check (if exists)
        working-directory: server
        continue-on-error: true
        run: |
          if [ -f "vendor/bin/pint" ]; then
            vendor/bin/pint --test
          else
            echo "Pint not installed, skipping formatting check"
          fi

      - name: Run PHPStan static analysis (if exists)
        working-directory: server
        continue-on-error: true
        run: |
          if [ -f "vendor/bin/phpstan" ]; then
            vendor/bin/phpstan analyse app --level=4 --error-format=github
          else
            echo "PHPStan not installed, skipping static analysis"
          fi

  # ========================================
  # FINAL STATUS CHECK
  # ========================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci]
    if: always()
    
    steps:
      - name: Check CI results
        run: |
          if [ "${{ needs.frontend-ci.result }}" = "failure" ] || [ "${{ needs.backend-ci.result }}" = "failure" ]; then
            echo "❌ CI pipeline failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"

      - name: Success notification
        if: success()
        run: echo "🎉 Frontend and backend CI passed successfully!"
