name: Deploy to Azure Production

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Azure
    
    steps:
    - uses: actions/checkout@v3

    - name: Trigger deployment
      run: |
        echo "🚀 Azure Deployment triggered for Sheltra"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '24'

    - name: Build frontend for production
      run: |
        cd client
        npm ci
        npm run build
      env:
        VITE_API_URL: ${{ secrets.PRODUCTION_API_URL }}

    - name: Prepare backend deployment
      working-directory: server
      run: |
        composer install --prefer-dist --no-dev --optimize-autoloader

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}
        username: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_CONTAINER_REGISTRY_PASSWORD }}

    - name: Build and push Docker images
      run: |
        # Build and push client image
        docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-client:${{ github.sha }} \
          -t ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-client:latest \
          -f client/Dockerfile client/
        docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-client:${{ github.sha }}
        docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-client:latest

        # Build and push server image
        docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-server:${{ github.sha }} \
          -t ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-server:latest \
          -f server/Dockerfile server/
        docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-server:${{ github.sha }}
        docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-server:latest

    - name: Create deployment package
      run: |
        mkdir -p dist
        cp -r client/dist/* dist/ 2>/dev/null || true
        cp -r server/* dist/ 2>/dev/null || true
        echo "Deployment package created"

    - name: Upload deployment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sheltra-production-build
        path: dist/
        retention-days: 30

    - name: Deploy to Azure App Service - Client
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_APP_SERVICE_CLIENT }}
        images: ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-client:${{ github.sha }}

    - name: Deploy to Azure App Service - Server
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_APP_SERVICE_SERVER }}
        images: ${{ secrets.AZURE_CONTAINER_REGISTRY_URL }}/sheltra-server:${{ github.sha }}

    - name: Create Release
      uses: actions/create-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Sheltra Release ${{ github.ref }}
        body: |
          ## 📦 Sheltra Release
          - **Version**: ${{ github.ref }}
          - **Commit**: ${{ github.sha }}
          - **Date**: ${{ github.event.head_commit.timestamp }}
          - **Environment**: Azure Production
          
          ### 🚀 What's New:
          See commits for details: ${{ github.event.head_commit.url }}
        draft: false
        prerelease: false

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Azure deployment completed successfully"
        echo "🐳 Images: sheltra-client:${{ github.sha }}, sheltra-server:${{ github.sha }}"
        echo "🔗 Azure App Services updated"

    - name: Send Slack notification
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Sheltra Azure Deployment: ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,commit,author,action
      continue-on-error: true

    - name: Log out of Azure
      if: always()
      run: az logout