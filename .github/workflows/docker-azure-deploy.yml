name: Deploy Sheltra (React + Laravel) to Azure

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Docker Images

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build frontend (React + Vite)
      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_BACKEND_ENDPOINT=${{ secrets.VITE_BACKEND_ENDPOINT }} \
            -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-frontend:${{ github.sha }} \
            -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-frontend:latest \
            -f client/Dockerfile \
            client/
        env:
          VITE_BACKEND_ENDPOINT: ${{ secrets.VITE_BACKEND_ENDPOINT }}

      # Build backend (Laravel + PHP)
      - name: Build backend Docker image
        run: |
          docker build \
            -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-backend:${{ github.sha }} \
            -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-backend:latest \
            -f server/Dockerfile \
            server/

      # Log in to Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      # Push frontend image
      - name: Push frontend image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-frontend:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-frontend:latest

      # Push backend image
      - name: Push backend image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-backend:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Azure Web Apps

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy backend first (database migrations)
      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_BACKEND_NAME }}
          images: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-backend:${{ github.sha }}
          slot-name: production

      # Wait for backend to stabilize
      - name: Wait for backend deployment
        run: |
          echo "Waiting for backend deployment to stabilize..."
          sleep 30

      # Run database migrations (optional - uncomment if needed)
      - name: Run Laravel migrations
        if: false
        run: |
          az webapp remote-debugging on \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_BACKEND_NAME }}

      # Deploy frontend
      - name: Deploy frontend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_FRONTEND_NAME }}
          images: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/sheltra-frontend:${{ github.sha }}
          slot-name: production

      # Health checks
      - name: Health check frontend
        run: |
          for i in {1..5}; do
            if curl -f https://${{ secrets.AZURE_WEBAPP_FRONTEND_NAME }}.azurewebsites.net/; then
              echo "Frontend health check passed"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying..."
            sleep 10
          done
          echo "Frontend health check failed"
          exit 1

      - name: Health check backend
        run: |
          for i in {1..5}; do
            if curl -f https://${{ secrets.AZURE_WEBAPP_BACKEND_NAME }}.azurewebsites.net/api/health; then
              echo "Backend health check passed"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying..."
            sleep 10
          done
          echo "Backend health check failed"
          exit 1

      # Create Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Sheltra Release ${{ github.ref }}
          body: |
            ## 📦 Sheltra Release
            - **Version**: ${{ github.ref }}
            - **Commit**: ${{ github.sha }}
            - **Frontend**: sheltra-frontend:${{ github.sha }}
            - **Backend**: sheltra-backend:${{ github.sha }}
            
            ### Environment
            - **Platform**: Azure Web Apps
            - **Registry**: Azure Container Registry
            - **Date**: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false

      # Notifications
      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Sheltra deployment completed successfully"
          echo "🐳 Images:"
          echo "   - sheltra-frontend:${{ github.sha }}"
          echo "   - sheltra-backend:${{ github.sha }}"
          echo "🌐 Frontend: https://${{ secrets.AZURE_WEBAPP_FRONTEND_NAME }}.azurewebsites.net"
          echo "🔧 Backend: https://${{ secrets.AZURE_WEBAPP_BACKEND_NAME }}.azurewebsites.net"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Sheltra deployment failed"
          echo "Check the Actions tab for details"

      - name: Send Slack notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Sheltra Deployment: ${{ job.status }}
            Version: ${{ github.ref }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,commit,author,action
        continue-on-error: true

      # Logout
      - name: Logout from Azure
        run: az logout
        if: always()
