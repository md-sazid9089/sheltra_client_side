name: Docker CI/CD Pipeline for React & Laravel on Azure

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build and tag Docker images for React (frontend)
      - name: Build frontend Docker image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/react-app:${{ github.sha }} ./client
          docker tag ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/react-app:${{ github.sha }} ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/react-app:latest
          
      # Build and tag Docker images for Laravel (backend)
      - name: Build backend Docker image
        run: |
          docker build -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/laravel-app:${{ github.sha }} ./server
          docker tag ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/laravel-app:${{ github.sha }} ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/laravel-app:latest

      # Log in to Azure Container Registry (ACR)
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      # Push Docker images to ACR
      - name: Push frontend Docker image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/react-app:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/react-app:latest
          
      - name: Push backend Docker image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/laravel-app:${{ github.sha }}
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/laravel-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Login to Azure
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy frontend Docker container to Azure Web App for Containers
      - name: Deploy frontend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_FRONTEND_NAME }}
          images: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/react-app:${{ github.sha }}

      # Deploy backend Docker container to Azure Web App for Containers
      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_BACKEND_NAME }}
          images: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/laravel-app:${{ github.sha }}

      # Logout from Azure
      - name: Logout from Azure
        run: az logout
        if: always()
