name: CI - Frontend Only

on:
  push:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci.yml'
      - '.nvmrc'
  pull_request:
    branches: [main, develop]
    paths:
      - 'client/**'
      - '.github/workflows/frontend-ci.yml'
      - '.nvmrc'
  workflow_dispatch:

jobs:
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Check code formatting with Prettier
        working-directory: client
        run: npx prettier --check . || echo "Warning: Some files need formatting (non-blocking)"
        continue-on-error: true

      - name: Run ESLint (if configured)
        working-directory: client
        run: |
          if [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ]; then
            npm run lint 2>/dev/null || echo "No lint script, trying npx eslint..."
            npx eslint src/ --max-warnings=10
          else
            echo "ESLint not configured, skipping"
          fi
        continue-on-error: true

      - name: Build frontend
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://api.example.com
          VITE_BACKEND_ENDPOINT: https://api.example.com
          VITE_STRIPE_PUBLIC_KEY: pk_test_example
          VITE_APP_ENV: production

      - name: Verify build output
        working-directory: client
        run: |
          if [ ! -d "dist" ] || [ ! -f "dist/index.html" ]; then
            echo "❌ Build failed: dist/index.html not found"
            exit 1
          fi
          echo "✅ Build successful"
          echo "Build artifacts summary:"
          ls -lh dist/ | grep -E '\.js$|\.css$|\.html$' || true

      - name: Check bundle size
        working-directory: client
        run: |
          echo "Build artifact sizes:"
          find dist -type f \( -name "*.js" -o -name "*.css" \) -exec ls -lh {} \;
          TOTAL_SIZE=$(du -sh dist | cut -f1)
          echo "Total dist size: $TOTAL_SIZE"
          if [ $(du -sm dist | cut -f1) -gt 500 ]; then
            echo "⚠️  Warning: Build bundle size is large (> 500MB)"
          fi
        continue-on-error: true

      - name: Run tests (if configured)
        working-directory: client
        run: |
          if grep -q '"test"' package.json && [ -d "src/__tests__" ]; then
            npm run test 2>/dev/null || echo "Tests not found or failed"
          else
            echo "No tests configured, skipping test step"
          fi
        continue-on-error: true
