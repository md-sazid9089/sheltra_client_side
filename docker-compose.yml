services:
  # ──────────────────────────────────────────
  # Backend – Laravel / PHP / Apache
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: sheltra-backend:latest
    container_name: sheltra_backend
    ports:
      - "8000:80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - sheltra_network

  # ──────────────────────────────────────────
  # Frontend – React + Nginx
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
      args:
        VITE_BACKEND_ENDPOINT: ${VITE_BACKEND_ENDPOINT}
    image: sheltra-frontend:latest
    container_name: sheltra_frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sheltra_network
    volumes:
      - ./client/src:/app/src

  # ──────────────────────────────────────────
  # phpMyAdmin – MySQL Web Interface (Optional)
  # ──────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sheltra_phpmyadmin
    ports:
      - "8080:80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - sheltra_network

volumes: {}

networks:
  sheltra_network:
    driver: bridge
