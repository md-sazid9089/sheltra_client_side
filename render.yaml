# Render Deploy Configuration for Sheltra Backend
# This file (render.yaml) goes in the project root
# It defines all services and their configurations

services:
  # ======================================
  # PRIMARY: Web API Service
  # ======================================
  - type: web
    name: sheltra-api
    env: docker
    rootDir: server
    repo: https://github.com/your-org/sheltra_client_side
    branch: main
    
    # Build configuration
    buildCommand: docker build -t sheltra-api .
    
    # Start command - only web server, no background jobs (separate services below)
    startCommand: php artisan serve --host=0.0.0.0 --port=8000
    
    # Resource sizing
    plan: starter
    numInstances: 1
    
    # Environment variables - non-secret, plain text
    envVars:
      - key: APP_NAME
        value: Sheltra
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: error
      - key: LOG_CHANNEL
        value: stderr
      - key: APP_URL
        value: https://api.sheltra.app
      - key: FRONTEND_URL
        value: https://sheltra.app
      - key: DB_CONNECTION
        value: mysql
      - key: CACHE_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: SESSION_DRIVER
        value: redis
    
    # Secrets - sensitive values from environment
    secrets:
      - key: APP_KEY
        value: ${APP_KEY}  # Set in Render dashboard
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_PORT
        value: ${DB_PORT}
      - key: DB_DATABASE
        value: ${DB_DATABASE}
      - key: DB_USERNAME
        value: ${DB_USERNAME}
      - key: DB_PASSWORD
        value: ${DB_PASSWORD}
      - key: STRIPE_PUBLIC_KEY
        value: ${STRIPE_PUBLIC_KEY}
      - key: STRIPE_SECRET_KEY
        value: ${STRIPE_SECRET_KEY}
      - key: GEMINI_API_KEY
        value: ${GEMINI_API_KEY}
      - key: REDIS_HOST
        value: ${REDIS_HOST}
      - key: REDIS_PASSWORD
        value: ${REDIS_PASSWORD}
      - key: MAIL_HOST
        value: ${MAIL_HOST}
      - key: MAIL_PORT
        value: ${MAIL_PORT}
      - key: MAIL_USERNAME
        value: ${MAIL_USERNAME}
      - key: MAIL_PASSWORD
        value: ${MAIL_PASSWORD}
      - key: MAIL_FROM_ADDRESS
        value: ${MAIL_FROM_ADDRESS}
    
    # Health check configuration
    healthCheck:
      path: /api/health
      initialDelaySeconds: 30
      intervalSeconds: 30
      timeoutSeconds: 5
      maxFailedHealthChecks: 3
    
    # Auto-deploy on main branch
    autoDeploy: on_push
    
    # Pre-start commands (migrations, cache clearing)
    preStartCommands:
      - php artisan migrate --force --env=production
      - php artisan config:cache
      - php artisan route:cache
      - php artisan view:cache

  # ======================================
  # SECONDARY: Background Job Queue Worker
  # (Only deploy when business-critical jobs are in use)
  # ======================================
  - type: background_worker
    name: sheltra-queue-worker
    env: docker
    rootDir: server
    repo: https://github.com/your-org/sheltra_client_side
    branch: main
    
    buildCommand: docker build -t sheltra-api .
    
    # Command to process background jobs
    startCommand: php artisan queue:work --queue=default,high --timeout=60 --tries=3 --max-attempts=3
    
    plan: starter
    numInstances: 1  # Scale to 2+ for production
    
    # Share environment with web service (required)
    envVars:
      - key: APP_NAME
        value: Sheltra
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_DRIVER
        value: redis
      - key: LOG_CHANNEL
        value: stderr
    
    secrets:
      - key: APP_KEY
        value: ${APP_KEY}
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_PORT
        value: ${DB_PORT}
      - key: DB_DATABASE
        value: ${DB_DATABASE}
      - key: DB_USERNAME
        value: ${DB_USERNAME}
      - key: DB_PASSWORD
        value: ${DB_PASSWORD}
      - key: REDIS_HOST
        value: ${REDIS_HOST}
      - key: REDIS_PASSWORD
        value: ${REDIS_PASSWORD}

  # ======================================
  # SECONDARY: Scheduler (Cron-like tasks)
  # (Tasks that run on a schedule: hourly, daily, etc.)
  # ======================================
  - type: background_worker
    name: sheltra-scheduler
    env: docker
    rootDir: server
    repo: https://github.com/your-org/sheltra_client_side
    branch: main
    
    buildCommand: docker build -t sheltra-api .
    
    # Command to run scheduler every minute
    startCommand: |
      while true; do
        php artisan schedule:run --verbose
        sleep 60
      done
    
    plan: starter
    numInstances: 1  # Always exactly 1
    
    envVars:
      - key: APP_NAME
        value: Sheltra
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_DRIVER
        value: redis
    
    secrets:
      - key: APP_KEY
        value: ${APP_KEY}
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_PORT
        value: ${DB_PORT}
      - key: DB_DATABASE
        value: ${DB_DATABASE}
      - key: DB_USERNAME
        value: ${DB_USERNAME}
      - key: DB_PASSWORD
        value: ${DB_PASSWORD}
      - key: REDIS_HOST
        value: ${REDIS_HOST}
      - key: REDIS_PASSWORD
        value: ${REDIS_PASSWORD}

# ======================================
# DATABASE CONFIGURATION (External)
# ======================================
# Note: Render manages databases separately
# Set the following in Render dashboard:
# 1. Create managed PostgreSQL or connect external MySQL
# 2. Copy connection string to shell environment
# 3. Set DB_HOST, DB_USERNAME, DB_PASSWORD in Render
#
# For MySQL:
#   - Host: your-rds-endpoint.amazonaws.com
#   - Database: sheltra_prod
#   - User: sheltra_user
#   - Password: (set in Render Secrets)
#
# For Render PostgreSQL:
#   - Create via Render UI
#   - Auto-provided to services

# ======================================
# REDIS CONFIGURATION (External or Managed)
# ======================================
# Options:
#
# 1. Render Redis (Recommended)
#    - Create in Render UI
#    - Auto-provided as environment variable
#
# 2. External Redis (AWS ElastiCache)
#    - Host: redis.example.com
#    - Port: 6379
#    - Password: (set in Render Secrets)
#
# Configure in Render UI:
#   REDIS_HOST=redis.example.com
#   REDIS_PASSWORD=(secret)

# ======================================
# DEPLOYMENT WORKFLOW
# ======================================
# 1. Commit render.yaml to root of repository
# 2. Push to main branch
# 3. Go to Render dashboard
# 4. "New" → "Web Service" → select repository
# 5. Choose "render.yaml" option
# 6. Set all secrets in Render UI
# 7. Click "Create Web Service"
# 8. Render reads render.yaml and deploys all 3 services
# 9. Monitor deployment in Render dashboard
# 10. Verify health check passes

# ======================================
# IMPORTANT NOTES
# ======================================
# - render.yaml is optional; can config via UI instead
# - All services must share same code (same branch)
# - Database migrations run only on web service (preStartCommands)
# - Queue worker & scheduler are optional (comment out if not needed)
# - Use starter plan for testing, manual for production
# - Monitor logs in Render: Dashboard → Service → Logs tab
# - Scaling: Adjust numInstances or change plan tier
# - Rollback: Render keeps deployment history (1-click rollback)
